# Промпты LLM-судьи для харнесса. ragas_claims/ragas_verdict/ragas_questions перенесены
# сюда verbatim из modules/prompts_local.yaml (секция `ragas:`, была частью инференс-пути,
# когда faithfulness/answer_relevancy считались узлом графа) — судья теперь живёт только
# в evaluation/, промпты переехали вместе с ним. coverage_points/coverage_verdict — новые.
judge:
  ragas_claims:
    system: >
      Ты разбиваешь текст ответа на список отдельных атомарных фактических утверждений
      (claims) для последующей проверки достоверности (методика RAGAS Faithfulness).
    user: |
      Ответ:
      {answer}

      Разбей этот ответ на список атомарных фактических утверждений (до 15 самых важных,
      если утверждений больше). Каждое утверждение должно быть проверяемым само по себе,
      без местоимений и без ссылок на другие утверждения списка. Даже если ответ длинный,
      разбит на разделы или отформатирован как markdown — всё равно извлеки ключевые
      фактические утверждения из его содержимого. Пустой список верни только если в ответе
      вообще нет проверяемых фактов (например, это отказ ответить).

  ragas_verdict:
    system: >
      Ты проверяешь, подтверждается ли конкретное утверждение данным контекстом
      (методика RAGAS Faithfulness).
    user: |
      Контекст:
      {context}

      Утверждение:
      "{claim}"

      Определи, можно ли вывести это утверждение ИСКЛЮЧИТЕЛЬНО из контекста
      (supported=true), или оно не подтверждается либо противоречит контексту
      (supported=false).

  ragas_questions:
    system: >
      Ты генерируешь вопросы, на которые данный ответ был бы точным и полным ответом
      (методика RAGAS Answer Relevancy).
    user: |
      Ответ:
      {answer}

      Сгенерируй 3 различных вопроса, на которые этот ответ является точным и полным
      ответом. Если ответ уклончивый, неполный или не по существу — верни пустой список
      вопросов и noncommittal=true.

  coverage_points:
    system: >
      Ты выделяешь ключевые тезисы научного текста для последующей проверки, отражены ли
      они в его кратком обзоре (метрика Coverage — зеркало Faithfulness: не что добавлено
      лишнего, а что упущено).
    user: |
      Исходный текст:
      {source}

      Выдели до 15 ключевых тезисов этого текста — конкретных фактов, результатов,
      методов или выводов, которые хороший обзор ОБЯЗАН сохранить. Для каждого укажи
      importance: "core" — если это центральный результат/вывод, без которого обзор
      неполон; "supporting" — если это вспомогательная деталь. Формулируй тезисы кратко
      и самодостаточно, без ссылок на нумерацию источника.

  coverage_verdict:
    system: >
      Ты проверяешь, отражён ли конкретный тезис исходного текста в его кратком обзоре
      (метрика Coverage).
    user: |
      Обзор:
      {candidate}

      Тезис исходного текста:
      "{point}"

      Определи, присутствует ли этот тезис в обзоре — пусть даже перефразированный или
      сокращённый, но с сохранением сути (covered=true), или обзор его вообще не
      затрагивает (covered=false).
